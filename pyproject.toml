[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amber"
version = "1.9.6"
description = "The Amber columnar time-series engine, in process, with zero-copy NumPy/Arrow/pandas interop"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "the Amber authors" }]
keywords = ["amber", "kdb", "q", "kdb+", "array", "columnar", "time-series", "hft", "arrow", "vector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# Deliberately no runtime dependencies. NumPy, pandas, PyArrow and Polars are
# reached through the buffer protocol and the Arrow C data interface, both of
# which are ABI contracts rather than Python imports -- so each one is optional,
# imported lazily at the point of use, and never pinned by this package.
dependencies = []

[project.optional-dependencies]
numpy  = ["numpy>=1.20"]
pandas = ["pandas>=1.3", "numpy>=1.20"]
arrow  = ["pyarrow>=12"]
all    = ["numpy>=1.20", "pandas>=1.3", "pyarrow>=12", "polars>=0.20"]
dev    = ["pytest>=7", "numpy>=1.20", "pandas>=1.3", "pyarrow>=12"]

[project.urls]
Homepage = "https://github.com/BonucciAndrea/python-amber"
Engine   = "https://github.com/BonucciAndrea/amber"
Issues   = "https://github.com/BonucciAndrea/python-amber/issues"

[project.scripts]
amber-py = "amber.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["amber*"]

[tool.setuptools.package-data]
amber = ["libamber.so", "libamber.dylib", "amber.dll", "kmodules/*.k", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

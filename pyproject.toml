[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amber-lang"
version = "2.9.4"
description = "The Amber columnar time-series engine, in process, with zero-copy NumPy/Arrow/pandas interop"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bonucci Andrea" }]
keywords = ["amber", "kdb", "q", "kdb+", "array", "columnar", "time-series", "hft", "arrow", "vector"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# Deliberately no runtime dependencies. NumPy, pandas, PyArrow and Polars are
# reached through the buffer protocol and the Arrow C data interface, both of
# which are ABI contracts rather than Python imports -- so each one is optional,
# imported lazily at the point of use, and never pinned by this package.
dependencies = []

[project.optional-dependencies]
numpy  = ["numpy>=1.20"]
pandas = ["pandas>=1.3", "numpy>=1.20"]
arrow  = ["pyarrow>=12"]
all    = ["numpy>=1.20", "pandas>=1.3", "pyarrow>=12", "polars>=0.20"]
test   = ["pytest>=7", "hypothesis>=6", "numpy>=1.20", "pandas>=1.3", "pyarrow>=12"]
dev    = ["pytest>=7", "hypothesis>=6", "numpy>=1.20", "pandas>=1.3", "pyarrow>=12", "polars>=0.20"]

[project.urls]
Homepage = "https://github.com/BonucciAndrea/python-amber"
Engine   = "https://github.com/BonucciAndrea/amber"
Issues   = "https://github.com/BonucciAndrea/python-amber/issues"
Changelog = "https://github.com/BonucciAndrea/python-amber/blob/main/CHANGELOG.md"

[project.scripts]
amber-py = "amber.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["amber*"]

[tool.setuptools.package-data]
amber = ["libamber.so", "libamber.dylib", "amber.dll", "kmodules/*.k", "py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:amber.*"]

# Wheels: Linux (manylinux, x86_64 + aarch64) and macOS (arm64 + x86_64), one
# per CPython. The engine is built from vendor/amber inside each build
# environment, and the suite runs against the INSTALLED wheel, not the tree.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *t-*"
test-extras = ["test"]
test-command = "pytest {project}/tests -q -p no:cacheprovider"
build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
